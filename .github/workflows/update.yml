name: Collect matches & deploy
on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: '추가 수집할 게임 서버 프로필 ID (비워두면 ssapo + Hera)'
        required: false
        type: string
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'engine/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ssapo-aoe2-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay parser
        run: |
          python -m pip install -r requirements.txt
          python scripts/patch_parser.py
      - name: Check collector behavior
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.cjs
      - name: Engine source (genie + research patch)
        id: engine_source
        continue-on-error: true
        run: |
          git fetch --depth 1 origin research/genie-188329
          git show FETCH_HEAD:research/genie/sorted-lists-and-truth-trace.patch | tr -d '\r' > "$RUNNER_TEMP/engine.patch"
          git clone https://github.com/librematch/genie.git "$RUNNER_TEMP/genie"
          cd "$RUNNER_TEMP/genie"
          git checkout 91d81be4
          git apply "$RUNNER_TEMP/engine.patch"
          echo "ENGINE_PATCH_SHA=$(sha256sum "$RUNNER_TEMP/engine.patch" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: steps.engine_source.outcome == 'success'
        with:
          path: ${{ runner.temp }}/engine-bin
          key: genie-bin-91d81be4-${{ env.ENGINE_PATCH_SHA }}
      - name: Build engine and fetch private game data
        if: steps.engine_source.outcome == 'success'
        continue-on-error: true
        env:
          AOE2_DATA_TOKEN: ${{ secrets.AOE2_DATA_TOKEN }}
        run: |
          if [ -z "$AOE2_DATA_TOKEN" ]; then echo "AOE2_DATA_TOKEN is not set: engine results are skipped"; exit 1; fi
          if [ ! -x "$RUNNER_TEMP/engine-bin/census" ]; then
            rustup toolchain install stable --profile minimal
            rustup default stable
            (cd "$RUNNER_TEMP/genie" && cargo build --release -p genie-oracle --example census)
            mkdir -p "$RUNNER_TEMP/engine-bin"
            cp "$RUNNER_TEMP/genie/target/release/examples/census" "$RUNNER_TEMP/engine-bin/census"
          fi
          git clone --quiet --depth 1 "https://x-access-token:${AOE2_DATA_TOKEN}@github.com/ssapo/aoe2-data.git" "$RUNNER_TEMP/aoe2-data"
          echo "d0aefd92428e2215d6f4d9b1d544901e6f171e19183f9e0b88218de5153a337f  $RUNNER_TEMP/aoe2-data/188329/empires2_x2_p1.dat" | sha256sum --check --quiet
          echo "AOE2_ENGINE_BIN=$RUNNER_TEMP/engine-bin/census" >> "$GITHUB_ENV"
          echo "AOE2_ENGINE_DATA=$RUNNER_TEMP/aoe2-data/188329/empires2_x2_p1.dat" >> "$GITHUB_ENV"
      - name: Collect public matches
        id: collect
        continue-on-error: true
        env:
          REQUESTED_PROFILE_ID: ${{ github.event.inputs.profile_id }}
        run: python scripts/collect_profiles.py
      - name: Update player search index
        timeout-minutes: 6
        continue-on-error: true
        run: python scripts/player_index.py
      - name: Build ranked benchmarks
        run: python scripts/ranked_benchmarks.py
      - name: Keep report history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update public match report'
            # main can move while this job runs (a docs or code push): put the report commit on top of it and try again.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then pushed=true; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" != true ]; then echo 'Could not push the report after 3 tries.'; exit 1; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Website deployed with preserved data; collection failed. Check profile ID, API availability and parser compatibility.'
          exit 1
