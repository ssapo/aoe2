name: Collect matches & deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ssapo-aoe2-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay parser
        run: |
          python -m pip install -r requirements.txt
          python scripts/patch_parser.py
      - name: Check collector behavior
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_collection_watch.cjs
      - name: Collect public matches
        id: collect
        continue-on-error: true
        run: python scripts/collect.py --limit 5
      - name: Keep report history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/report.json site/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public match report'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Website deployed with preserved data; collection failed. Check profile ID, API availability and parser compatibility.'
          exit 1
